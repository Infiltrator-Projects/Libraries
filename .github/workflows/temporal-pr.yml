# SPDX-License-Identifier: GPL-3.0-or-later
# Validate Common temporal APIs; provider implementations build in their own repositories.
# The broader main-branch pipeline retains self-hosted jobs.
name: Temporal API PR

on:
  pull_request:
    paths:
      - 'resources/temporal/**'
      - 'src/temporal*'
      - 'src/string_internal.h'
      - 'tests/temporal*'
      - 'include/infiltratr/core.h'
      - 'VERSION'
      - '.github/workflows/temporal-pr.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  native-sanitizers:
    name: Common Clang ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sanitizer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential
      - name: Verify Common with address and undefined behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make clean
          make CC=clang CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  clang-strict:
    name: Common strict Clang on clean host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Clang toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake build-essential
      - name: Exercise full strict Clang and CMake consumer tests
        run: |
          make clean
          make CC=clang check
          make clean
          make CC=clang portable-check
          make clean
          make CC=clang shared
          cmake -S . -B cmake-build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DINFILTRATR_COMMON_BUILD_TESTS=ON -DINFILTRATR_COMMON_WARNINGS_AS_ERRORS=ON -DINFILTRATR_COMMON_BUILD_SHARED=ON
          cmake --build cmake-build --parallel
          ctest --test-dir cmake-build --output-on-failure
          cmake --install cmake-build --prefix "$PWD/cmake-install"
          cmake -S tests/cmake-consumer -B cmake-consumer-build -DCMAKE_C_COMPILER=clang -DCMAKE_PREFIX_PATH="$PWD/cmake-install"
          cmake --build cmake-consumer-build --parallel
          ./cmake-consumer-build/infiltratr-common-consumer
