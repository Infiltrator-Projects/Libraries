# SPDX-License-Identifier: GPL-3.0-or-later
name: Philosophy adoption

on:
  push:
    branches: [main]
    paths:
      - docs/PHILOSOPHY.md
      - tools/check-philosophy-adoption.cpp
      - .github/workflows/philosophy-adoption.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify philosophy adoption across Infiltrator Projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libjson-c-dev
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            tools/check-philosophy-adoption.cpp \
            $(pkg-config --cflags --libs libcurl json-c) \
            -o "$RUNNER_TEMP/check-philosophy-adoption"
          "$RUNNER_TEMP/check-philosophy-adoption"
