# SPDX-License-Identifier: GPL-3.0-or-later
name: Common filesystem V2 contract (PR)
on:
  pull_request:
    paths:
      - 'include/infiltratr/filesystem_module*.h'
      - 'include/infiltratr/filesystem_module_loader.h'
      - 'src/filesystem_module_loader.c'
      - 'tests/filesystem_module_v2_*.c'
      - 'CMakeLists.txt'
      - '.github/workflows/filesystem-v2-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abi-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject retired filesystem APIs and compatibility paths
        shell: bash
        run: |
          set -euo pipefail
          test ! -e include/infiltratr/filesystem_module.h
          test ! -e docs/FILESYSTEM_COMMON_ABI_V1.md
          if grep -EnR 'IfsFs[A-Za-z0-9_]*V1|IFS_FS_[A-Z0-9_]*V1|base_v1|infiltrator_filesystem_api_v1|IFS_FS_COMMON_EXPORT_V1|filesystem_module\.h' \
              include/infiltratr/filesystem_module_v2.h \
              include/infiltratr/filesystem_module_loader.h \
              src/filesystem_module_loader.c \
              tests/filesystem_module_v2_smoke.c \
              tests/filesystem_module_v2_loader_smoke.c \
              tests/filesystem_module_v2_native_fixture.c; then
            echo "Retired filesystem ABI detected" >&2
            exit 1
          fi
      - name: Compile freestanding ABI and loadable native-V2 fixtures
        run: |
          cmake -S . -B build-abi -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF \
            -DINFILTRATR_COMMON_BUILD_TESTS=ON \
            -DINFILTRATR_COMMON_WARNINGS_AS_ERRORS=ON
          cmake --build build-abi --parallel 2 \
            --target infiltratr-filesystem-module-v2-smoke \
                     infiltratr-filesystem-module-v2-loader-smoke
          ctest --test-dir build-abi --output-on-failure \
            -R '^infiltratr-filesystem-module-v2-(smoke|loader-smoke)$'
