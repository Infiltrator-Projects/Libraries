# SPDX-License-Identifier: GPL-3.0-or-later
name: Libraries CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: common-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  temporal-consumer-abi:
    name: Independent provider ABI / ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:24.04, debian:13]
    steps:
      - name: Install consumer-test dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git ca-certificates python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install qualified modules from all 54 independent releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/temporal-packages.py fetch "$RUNNER_TEMP/independent-providers"
          python3 tools/temporal-packages.py install "$RUNNER_TEMP/independent-providers"
      - name: Exercise Common's public API against the prebuilt providers
        run: make temporal-provider-check

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce main-only automatic immutable publishing
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            tests/check-temporal-ownership.cpp -o "$RUNNER_TEMP/check-temporal-ownership"
          "$RUNNER_TEMP/check-temporal-ownership" .
          release=.github/workflows/release.yml
          grep -Fq '  workflow_run:' "$release"
          grep -Fq 'workflows: ["Libraries CI"]' "$release"
          grep -Fq "github.event.workflow_run.head_branch == 'main'" "$release"
          grep -Fq 'published releases are immutable' "$release"
          grep -Fq 'git archive --format=zip' "$release"
          if grep -Eq 'make (check|portable-check)|cmake --build|ctest --test-dir' "$release"; then
            echo 'Publication must consume the qualified source instead of owning another test graph.' >&2
            exit 1
          fi
          if grep -Eq '^  workflow_dispatch:|^  pull_request:|^  schedule:' "$release"; then exit 1; fi
          if grep -Eq '^  pull_request:|^  merge_group:' .github/workflows/ci.yml; then exit 1; fi

  design-contract:
    name: Design contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify local design dependencies
        shell: bash
        run: |
          set -euo pipefail
          for command_name in jq bash grep; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "Runner is missing $command_name." >&2
              exit 1
            }
          done
      - name: Verify canonical web adapter
        run: |
          jq --version
          bash tests/check_design.sh

      - name: Verify source licence markers
        run: bash tests/check_spdx.sh

  strict-build:
    name: ${{ matrix.compiler }} strict build
    # Retain the qualified self-hosted GCC worker. Some other self-hosted
    # workers lack Clang; ensure strict Clang runs with a provisioned toolchain.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - compiler: gcc
            runner: [self-hosted, Linux, X64, linux-native]
          - compiler: clang
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install hosted Clang toolchain
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake build-essential
      - name: Verify local build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for command_name in "${{ matrix.compiler }}" make cmake ctest; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "Self-hosted runner is missing $command_name." >&2
              exit 1
            }
          done
      - name: Full Make and CMake verification
        run: |
          make clean
          make CC=${{ matrix.compiler }} check
          make clean
          make CC=${{ matrix.compiler }} portable-check
          make clean
          make CC=${{ matrix.compiler }} shared
          cmake -S . -B cmake-build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Debug -DINFILTRATR_COMMON_BUILD_TESTS=ON -DINFILTRATR_COMMON_WARNINGS_AS_ERRORS=ON -DINFILTRATR_COMMON_BUILD_SHARED=ON
          cmake --build cmake-build --parallel
          ctest --test-dir cmake-build --output-on-failure
          cmake --install cmake-build --prefix "$PWD/cmake-install"
          cmake -S tests/cmake-consumer -B cmake-consumer-build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_PREFIX_PATH="$PWD/cmake-install"
          cmake --build cmake-consumer-build --parallel
          ./cmake-consumer-build/infiltratr-common-consumer

  sanitizers:
    name: Clang ASan + UBSan
    # The sanitizer gate must not depend on unprovisioned self-hosted images.
    # Run with an explicit Clang toolchain on a disposable clean runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sanitizer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential
      - name: Verify local sanitizer dependencies
        shell: bash
        run: |
          set -euo pipefail
          for command_name in clang make; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "Self-hosted runner is missing $command_name." >&2
              exit 1
            }
          done
      - name: Run sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make clean
          make CC=clang CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  hosted-portable-smoke:
    name: Hosted Linux portable smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Independent clean-host portable verification
        run: make CC=gcc portable-check


  windows-package:
    name: Windows MSVC CMake
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      PSExecutionPolicyPreference: RemoteSigned
    steps:
      - name: Discover Windows build tools and Git Bash
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $gitRoot = Split-Path (Split-Path $git -Parent) -Parent
          $dirs = @((Join-Path $gitRoot 'bin'), (Join-Path $gitRoot 'usr\bin'), (Join-Path $env:ProgramFiles 'CMake\bin'))
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -property installationPath
            if ($vs) { $dirs += Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin' }
          }
          foreach ($dir in $dirs) {
            if (Test-Path $dir) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:PATH = "$dir;$env:PATH"
            }
          }
          Get-ExecutionPolicy -List
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect Windows executable policy
        shell: powershell
        run: |
          foreach ($log in @('Microsoft-Windows-CodeIntegrity/Operational', 'Microsoft-Windows-AppLocker/EXE and DLL', 'Microsoft-Windows-Windows Defender/Operational')) {
            Write-Host "Recent policy events: $log"
            try {
              Get-WinEvent -FilterHashtable @{LogName=$log; StartTime=(Get-Date).AddMinutes(-20)} -MaxEvents 20 -ErrorAction Stop |
                Where-Object { $_.Message -match 'actions-runner|infiltratr|link-test|RunnerScope|system-settings' } |
                Select-Object TimeCreated, Id, Message | Format-List
            } catch { Write-Host $_.Exception.Message }
          }

      - name: Build and test portable/Win32 Common
        shell: powershell
        run: |
          # Test native executables on ARM64 runners instead of relying on
          # optional x64 emulation to launch every contract-test binary.
          $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'ARM64' } else { 'x64' }
          cmake -S . -B cmake-build -A $architecture -DINFILTRATR_COMMON_BUILD_TESTS=ON -DINFILTRATR_COMMON_BUILD_SHARED=ON
          cmake --build cmake-build --config Release --parallel
          ctest --test-dir cmake-build -C Release --output-on-failure

  apple-package:
    name: Apple package / ${{ matrix.configuration }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Common owns the complete Apple portable source set
        shell: bash
        run: |
          project=apple/InfiltratrCommon.xcodeproj/project.pbxproj
          portable_sources="$(
            sed -n '/set(INFILTRATR_COMMON_PORTABLE_SOURCES/,/)/p' CMakeLists.txt |
              grep -oE 'src/[A-Za-z0-9_]+\.c'
          )"
          test -n "$portable_sources"
          for source_path in $portable_sources; do
            source="${source_path#src/}"
            grep -Fq "../src/${source}" "$project"
            grep -Fq "${source} in Sources" "$project"
          done
      - name: Build authoritative Apple portable target
        run: |
          xcodebuild -project apple/InfiltratrCommon.xcodeproj -target InfiltratrCommonPortable -configuration ${{ matrix.configuration }} -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
